<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Our Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#181b21; --card2:#1f232b; --text:#f2f3f5; --sub:#9aa1ad;
    --accent:#5ac8a0; --danger:#e0654f; --line:#2a2f38;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; overscroll-behavior:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #auth-screen{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px; gap:16px;}
  #auth-screen h1{font-size:28px; margin:0 0 4px;}
  #auth-screen p{color:var(--sub); margin:0 0 12px; font-size:14px;}
  input{width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card);
    color:var(--text); font-size:16px; margin-bottom:10px;}
  button{font-size:16px; border:none; border-radius:12px; padding:14px; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#0f1115; font-weight:700; width:100%;}
  .btn-secondary{background:var(--card2); color:var(--text); width:100%;}
  #auth-error{color:var(--danger); font-size:13px; min-height:16px;}
  #app{display:none; max-width:480px; margin:0 auto; min-height:100vh; padding-top:env(safe-area-inset-top);}
  header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px;}
  header .month{font-size:22px; font-weight:800;}
  header .who{display:flex; gap:4px;}
  .avatar{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12px; background:var(--card2);}
  .seg{display:flex; margin:8px 20px 16px; background:var(--card2); border-radius:10px; padding:3px;}
  .seg button{flex:1; background:transparent; color:var(--sub); padding:8px; border-radius:8px; font-weight:600;}
  .seg button.active{background:var(--accent); color:#0f1115;}
  .hero{margin:0 20px 20px; padding:20px; background:var(--card); border-radius:16px;}
  .hero .label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); font-weight:700;}
  .hero .amt{font-size:46px; font-weight:800; margin:4px 0; letter-spacing:-.02em;}
  .hero .sub{color:var(--sub); font-size:13px; margin-bottom:10px;}
  .bar{height:8px; background:var(--card2); border-radius:6px; overflow:hidden;}
  .bar>div{height:100%; border-radius:6px; transition:width .3s;}
  .section-title{padding:16px 20px 6px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); font-weight:700;}
  .cat-row{display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); cursor:pointer;}
  .cat-row:active{background:var(--card2);}
  .cat-main{flex:1; min-width:0;}
  .cat-top{display:flex; justify-content:space-between; font-size:15px; font-weight:600; margin-bottom:6px;}
  .cat-top .amts{color:var(--sub); font-weight:500; font-size:13px;}
  .exp-row{display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line);}
  .exp-row .meta{font-size:13px; color:var(--sub);}
  .exp-row .amt{font-weight:700;}
  .del-x{color:var(--danger); font-size:13px; margin-left:12px; padding:4px 8px;}
  .fab{position:fixed; right:24px; bottom:calc(24px + env(safe-area-inset-bottom)); width:60px; height:60px;
    border-radius:50%; background:var(--accent); color:#0f1115; font-size:30px; font-weight:400; line-height:60px;
    text-align:center; box-shadow:0 8px 24px rgba(90,200,160,.4); border:none;}
  .sheet-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10;}
  .sheet{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-radius:20px 20px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom)); z-index:11; max-height:85vh; overflow-y:auto;}
  .sheet h3{margin:0 0 14px;}
  select{width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card);
    color:var(--text); font-size:16px; margin-bottom:10px;}
  .row2{display:flex; gap:10px;}
  .row2>*{flex:1;}
  .settings-cat{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .settings-cat input[type=text]{margin:0;}
  .settings-cat input[type=number]{margin:0; width:90px; text-align:right;}
  .icon-btn{background:none; color:var(--sub); font-size:20px; padding:4px 8px;}
  .top-link{color:var(--accent); font-weight:600; background:none; padding:4px; font-size:14px; width:auto;}
  .footer-link{text-align:center; color:var(--sub); font-size:13px; padding:20px; text-decoration:underline; cursor:pointer;}
  .empty{padding:24px 20px; color:var(--sub); font-size:14px; text-align:center;}
</style>
</head>
<body>

<div id="auth-screen">
  <h1>Our Budget</h1>
  <p id="auth-sub">Sign in to your shared household budget.</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <div id="auth-error"></div>
  <button class="btn-primary" id="signin-btn">Sign in</button>
</div>

<div id="app">
  <header>
    <div class="month" id="period-label">This Month</div>
    <div class="who" id="who-box"></div>
  </header>

  <div class="seg">
    <button id="seg-month" class="active">Month</button>
    <button id="seg-week">Week</button>
  </div>

  <div class="hero">
    <div class="label" id="hero-label">Left to spend</div>
    <div class="amt" id="hero-amt">$0</div>
    <div class="sub" id="hero-sub"></div>
    <div class="bar"><div id="hero-bar" style="width:0%; background:var(--accent);"></div></div>
  </div>

  <div class="section-title">Categories</div>
  <div id="cat-list"></div>

  <div class="section-title" id="exp-title" style="display:none;"></div>
  <div id="exp-list"></div>

  <div class="footer-link" id="settings-link">Settings &amp; sign out</div>
</div>

<button class="fab" id="add-fab" style="display:none;">+</button>

<!-- Add expense sheet -->
<div class="sheet-backdrop" id="add-backdrop"></div>
<div class="sheet" id="add-sheet" style="display:none;">
  <h3>Add expense</h3>
  <input id="exp-amount" type="number" inputmode="decimal" placeholder="Amount" step="0.01">
  <select id="exp-category"></select>
  <input id="exp-date" type="date">
  <input id="exp-note" type="text" placeholder="Note (optional)">
  <div class="row2">
    <button class="btn-secondary" id="add-cancel">Cancel</button>
    <button class="btn-primary" id="add-save">Save</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet-backdrop" id="settings-backdrop"></div>
<div class="sheet" id="settings-sheet" style="display:none;">
  <h3>Categories &amp; budgets</h3>
  <div id="settings-cats"></div>
  <div class="row2" style="margin-top:14px;">
    <button class="btn-secondary" id="add-cat-btn">+ Add category</button>
  </div>
  <div class="row2" style="margin-top:20px;">
    <button class="btn-secondary" id="signout-btn">Sign out</button>
    <button class="btn-primary" id="settings-done">Done</button>
  </div>
</div>

<script>
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

let session = null;
let categories = [];
let expenses = [];
let period = 'month'; // 'month' | 'week'

const $ = (id) => document.getElementById(id);
const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

function initials(email){
  return (email || '?').trim()[0].toUpperCase();
}

// ---------- Auth ----------
$('signin-btn').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  $('auth-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) $('auth-error').textContent = error.message;
};

sb.auth.onAuthStateChange((_event, s) => {
  session = s;
  if (session) {
    $('auth-screen').style.display = 'none';
    $('app').style.display = 'block';
    $('add-fab').style.display = 'block';
    boot();
  } else {
    $('auth-screen').style.display = 'flex';
    $('app').style.display = 'none';
    $('add-fab').style.display = 'none';
  }
});

$('signout-btn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- Date range helpers ----------
function getRange(){
  const now = new Date();
  if (period === 'week'){
    const day = now.getDay(); // 0 Sun
    const diffToMon = (day === 0 ? -6 : 1 - day);
    const start = new Date(now); start.setDate(now.getDate() + diffToMon); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(start.getDate() + 7);
    return { start, end, label: 'This Week' };
  } else {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth()+1, 1);
    return { start, end, label: start.toLocaleString('en-US', {month:'long', year:'numeric'}) };
  }
}
const iso = (d) => d.toISOString().slice(0,10);

// ---------- Data ----------
async function loadCategories(){
  const { data, error } = await sb.from('categories').select('*').order('sort_order', {ascending:true});
  if (!error) categories = data || [];
}

async function loadExpenses(){
  const { start, end } = getRange();
  const { data, error } = await sb.from('expenses').select('*')
    .gte('date', iso(start)).lt('date', iso(end)).order('date', {ascending:false});
  if (!error) expenses = data || [];
}

async function boot(){
  await loadCategories();
  await loadExpenses();
  renderAll();
  populateCategorySelect();

  sb.channel('realtime-expenses')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, async () => { await loadExpenses(); renderAll(); })
    .subscribe();
  sb.channel('realtime-categories')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, async () => { await loadCategories(); renderAll(); populateCategorySelect(); })
    .subscribe();

  // household avatars: show all distinct people who've ever added an expense, plus me
  renderWho();
}

async function renderWho(){
  const { data } = await sb.from('expenses').select('paid_by');
  const names = new Set([session.user.email]);
  (data||[]).forEach(r => r.paid_by && names.add(r.paid_by));
  $('who-box').innerHTML = [...names].slice(0,2).map(n => `<div class="avatar">${initials(n)}</div>`).join('');
}

// ---------- Render ----------
function renderAll(){
  const { label } = getRange();
  $('period-label').textContent = label;

  const totalBudget = categories.reduce((s,c) => s + Number(c.monthly_budget||0) * (period==='week' ? 12/52 : 1), 0);
  const totalSpent = expenses.reduce((s,e) => s + Number(e.amount||0), 0);
  const left = totalBudget - totalSpent;

  $('hero-label').textContent = period === 'week' ? "Left this week" : "Left to spend";
  $('hero-amt').textContent = money(left);
  $('hero-amt').style.color = left < 0 ? 'var(--danger)' : 'var(--text)';
  $('hero-sub').textContent = `${money(totalSpent)} spent of ${money(totalBudget)} budget`;
  const pct = totalBudget > 0 ? Math.min(100, (totalSpent/totalBudget)*100) : 0;
  $('hero-bar').style.width = pct + '%';
  $('hero-bar').style.background = pct >= 100 ? 'var(--danger)' : 'var(--accent)';

  const catHtml = categories.map(c => {
    const budget = Number(c.monthly_budget||0) * (period==='week' ? 12/52 : 1);
    const spent = expenses.filter(e => e.category === c.name).reduce((s,e)=>s+Number(e.amount||0),0);
    const p = budget > 0 ? Math.min(100,(spent/budget)*100) : 0;
    return `<div class="cat-row" onclick="showCategory('${c.name.replace(/'/g,"\\'")}')">
      <div class="cat-main">
        <div class="cat-top"><span>${c.name}</span><span class="amts">${money(spent)} / ${money(budget)}</span></div>
        <div class="bar"><div style="width:${p}%; background:${p>=100?'var(--danger)':'var(--accent)'}"></div></div>
      </div>
    </div>`;
  }).join('') || `<div class="empty">No categories yet. Add some in Settings.</div>`;
  $('cat-list').innerHTML = catHtml;

  if (window._activeCategory) showCategory(window._activeCategory, true);
}

function showCategory(name, silent){
  window._activeCategory = name;
  $('exp-title').style.display = 'block';
  $('exp-title').textContent = name;
  const rows = expenses.filter(e => e.category === name);
  $('exp-list').innerHTML = rows.map(e => `
    <div class="exp-row">
      <div>
        <div>${e.note || '(no note)'}</div>
        <div class="meta">${e.date} · ${e.paid_by ? e.paid_by.split('@')[0] : ''}</div>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="amt">${money(Number(e.amount))}</span>
        <span class="del-x" onclick="deleteExpense('${e.id}')">✕</span>
      </div>
    </div>`).join('') || `<div class="empty">No expenses yet in ${name}.</div>`;
}

async function deleteExpense(id){
  if (!confirm('Delete this expense?')) return;
  await sb.from('expenses').delete().eq('id', id);
}

// ---------- Segmented control ----------
$('seg-month').onclick = () => { period='month'; $('seg-month').classList.add('active'); $('seg-week').classList.remove('active'); loadExpenses().then(renderAll); };
$('seg-week').onclick = () => { period='week'; $('seg-week').classList.add('active'); $('seg-month').classList.remove('active'); loadExpenses().then(renderAll); };

// ---------- Add expense ----------
function populateCategorySelect(){
  $('exp-category').innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
}
$('add-fab').onclick = () => {
  $('exp-amount').value=''; $('exp-note').value='';
  $('exp-date').value = new Date().toISOString().slice(0,10);
  $('add-sheet').style.display='block'; $('add-backdrop').style.display='block';
};
$('add-cancel').onclick = $('add-backdrop').onclick = () => { $('add-sheet').style.display='none'; $('add-backdrop').style.display='none'; };
$('add-save').onclick = async () => {
  const amount = parseFloat($('exp-amount').value);
  const category = $('exp-category').value;
  const date = $('exp-date').value;
  const note = $('exp-note').value.trim();
  if (!amount || !category || !date) { alert('Amount, category and date are required.'); return; }
  const { error } = await sb.from('expenses').insert({ amount, category, date, note, paid_by: session.user.email });
  if (error) { alert(error.message); return; }
  $('add-sheet').style.display='none'; $('add-backdrop').style.display='none';
};

// ---------- Settings ----------
$('settings-link').onclick = () => { renderSettings(); $('settings-sheet').style.display='block'; $('settings-backdrop').style.display='block'; };
$('settings-done').onclick = $('settings-backdrop').onclick = () => { $('settings-sheet').style.display='none'; $('settings-backdrop').style.display='none'; };

function renderSettings(){
  $('settings-cats').innerHTML = categories.map(c => `
    <div class="settings-cat">
      <input type="text" value="${c.name}" onchange="renameCategory('${c.id}', this.value)">
      <input type="number" value="${c.monthly_budget}" onchange="updateBudget('${c.id}', this.value)">
      <button class="icon-btn" onclick="removeCategory('${c.id}')">🗑</button>
    </div>`).join('');
}
async function renameCategory(id, name){ await sb.from('categories').update({name}).eq('id', id); }
async function updateBudget(id, val){ await sb.from('categories').update({monthly_budget: parseFloat(val)||0}).eq('id', id); }
async function removeCategory(id){ if(confirm('Remove this category?')) await sb.from('categories').delete().eq('id', id); }
$('add-cat-btn').onclick = async () => {
  const name = prompt('Category name?'); if (!name) return;
  const budget = parseFloat(prompt('Monthly budget for this category?', '100')) || 0;
  await sb.from('categories').insert({ name, monthly_budget: budget, sort_order: categories.length });
  renderSettings();
};

// ---------- Register service worker (optional offline shell) ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
